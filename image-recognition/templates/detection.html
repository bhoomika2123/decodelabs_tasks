{% extends "base.html" %}
{% block title %}Object Detection · RecognizeAI{% endblock %}
{% block content %}
<section class="container py-5"><a href="/" class="small text-decoration-none">← Home</a><h1 class="fw-bold mt-3">Object Detection</h1><p class="text-secondary">Detect supported object classes with a local MobileNet-SSD model.</p>
<form id="recognition-form" data-endpoint="/api/detection" data-mode="detection" class="tool-card">
  <label class="form-label fw-semibold" for="image">Choose image</label><input class="form-control" id="image" name="image" type="file" accept="image/*" required>
  <div class="mt-3"><label for="threshold" class="form-label">Confidence threshold: <strong id="threshold-value">80%</strong></label><input class="form-range" type="range" min="0.30" max="0.95" step="0.05" value="0.80" name="threshold" id="threshold"></div>
  <img id="preview" class="preview d-none mt-3" alt="Selected image preview">
  <div class="d-flex flex-wrap gap-2 mt-4"><button class="btn btn-primary" type="submit">Detect Objects</button><button class="btn btn-outline-secondary" type="button" id="reset">Reset</button></div>
</form>
<div id="status" class="mt-3" role="status"></div><section id="results" class="tool-card mt-3 d-none"><h2 class="h5">Annotated image</h2><img id="annotated" class="preview" alt="Image with detected objects"><p class="mt-3 mb-1">Accepted detections: <strong id="count">0</strong></p><div id="detections" class="table-responsive"></div></section>
</section>
{% endblock %}
