{% extends "base.html" %}
{% block title %}Text OCR · RecognizeAI{% endblock %}
{% block content %}
<section class="container py-5">
  <a href="/" class="small text-decoration-none">← Home</a>
  <h1 class="fw-bold mt-3">Text Recognition (OCR)</h1>
  <p class="text-secondary">Upload an image to extract readable text.</p>
  <form id="recognition-form" data-endpoint="/api/ocr" data-mode="ocr" class="tool-card">
    <label class="form-label fw-semibold" for="image">Choose image</label>
    <input class="form-control" id="image" name="image" type="file" accept="image/*" required>
    <div class="row g-3 mt-1">
      <div class="col-md-8">
        <label class="form-label" for="preprocessing">Preprocessing</label>
        <select class="form-select" name="preprocessing" id="preprocessing">
          <option value="otsu">Otsu thresholding (recommended)</option>
          <option value="original">Original</option>
          <option value="grayscale">Grayscale</option>
          <option value="blur">Gaussian blur</option>
          <option value="adaptive">Adaptive thresholding</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="psm">Page segmentation mode</label>
        <select class="form-select" name="psm" id="psm">
          <option value="6">6 · Block of text</option>
          <option value="3">3 · Automatic</option>
          <option value="7">7 · Single line</option>
          <option value="11">11 · Sparse text</option>
        </select>
      </div>
    </div>
    <img id="preview" class="preview d-none mt-3" alt="Selected image preview">
    <div class="d-flex flex-wrap gap-2 mt-4">
      <button class="btn btn-primary" type="submit">Extract Text</button>
      <button class="btn btn-outline-secondary" type="button" id="reset">Reset</button>
    </div>
  </form>
<div id="status" class="mt-3" role="status"></div>
<section id="results" class="tool-card mt-3 d-none">
  <div class="d-flex justify-content-between align-items-center">
    <h2 class="h5">Extracted text</h2>
    <div class="d-flex gap-2">
      <button id="copy" class="btn btn-sm btn-outline-primary" type="button">Copy</button>
      <button id="download" class="btn btn-sm btn-outline-primary" type="button">Download .txt</button>
    </div>
  </div>
  <textarea id="result-text" class="form-control result-text" rows="10" readonly></textarea>
</section>
</section>
{% endblock %}
